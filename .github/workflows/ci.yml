name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  hygiene:
    # First, and separately, so a leak fails before anything is built, published or cached.
    # This repository is public; the cost of an accidental disclosure is not symmetric with the
    # cost of a red build.
    name: public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for domain specifics
        run: scripts/check-public-hygiene
        # ARGUS_EXTRA_DENYLIST is deliberately unset here. The list of employer, team, project
        # and protocol names is itself sensitive and lives in the private repository; it is
        # supplied by the private repository's own pipeline, which checks this tree out and
        # runs the same script with the variable set.

  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Argus.Controls.Maui targets net8.0-android everywhere and adds net8.0-windows10.0.19041.0
      # when built on Windows; iOS/MacCatalyst need a macOS runner this matrix doesn't have.
      - name: Install the MAUI workload
        run: dotnet workload install maui-android

      # Argus.Controls.Maui adds net8.0-windows10.0.19041.0 when built on Windows.
      - name: Install the MAUI Windows workload
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows

      - name: Restore tool dependencies
        run: dotnet restore src/Argus.Core/Argus.Core.csproj

      # The feed has to exist before the solution restores: samples/ and
      # tests/Argus.Package.Tests consume the packages rather than the projects, so that a
      # leaked type or a stray dependency fails here rather than in a consumer's build.
      - name: Pack into the local feed
        shell: bash
        run: scripts/pack-local --configuration Release --clean

      - name: Build
        run: dotnet build Argus.sln --configuration Release

      # The WinUI XAML compiler reports failures as a bare "MSB3073 ... exited with code 1"; its
      # real errors are in the input/output JSON and logs it writes under obj. Print them.
      - name: Dump WinUI XAML compiler output
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          find artifacts src -path '*windows*' \( -name 'output.json' -o -name 'input.json' -o -name '*.xbf.log' -o -name 'XamlSaveStateFile.xml' -o -name '*XamlCompiler*.log' \) 2>/dev/null | while read -r file; do
            echo "===== $file"
            cat "$file"
            echo
          done

      - name: Test
        run: dotnet test Argus.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # Diagnostic only: the tests above already passed or failed the job. Without this, an
      # exhausted account-wide artifact storage quota fails a green build.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  packages:
    name: package artifacts
    # Windows, like release.yml: the only runner that packs Argus.Controls.Maui's Android and
    # Windows builds together (journal §3.4).
    runs-on: windows-latest
    needs: [hygiene, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the MAUI workloads
        run: dotnet workload install maui-android maui-windows

      - name: Pack
        shell: bash
        run: scripts/pack-local --configuration Release --clean

      # A Controls.Maui packed without its Windows build restores fine and only fails in a
      # consumer's Windows build (journal §3.4). Fail here instead.
      - name: Check Controls.Maui carries every platform
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/local-feed -Filter 'BlackBeard.Argus.Controls.Maui.*.nupkg' | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            foreach ($tfm in 'lib/net8.0-android', 'lib/net8.0-windows10.0.19041') {
              if (-not ($zip.Entries | Where-Object { $_.FullName.StartsWith($tfm) })) {
                throw "$($package.Name) has no $tfm* folder"
              }
            }
          } finally { $zip.Dispose() }

      # The pack step above is the check; the upload is a convenience copy (release.yml packs
      # its own), so a full artifact storage quota must not fail it.
      - name: Upload packages
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/local-feed/*.nupkg
            artifacts/local-feed/*.snupkg
