name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish, without the leading v'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # required for NuGet Trusted Publishing's OIDC token exchange

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish to nuget.org
    # Windows: the only runner that builds both of Argus.Controls.Maui's platforms in one pack
    # (journal §3.4). Packed on Linux, the package silently lacks its Windows build.
    runs-on: windows-latest

    # A deployment environment, so publishing needs whatever approval the repository's
    # environment protection rules require. Publishing is the one irreversible step in this
    # repository: a package version, once pushed, cannot be replaced.
    environment: nuget

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink needs history to resolve the commit.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Argus.Controls.Maui builds for Android and, on this Windows runner, for Windows too.
      - name: Install the MAUI workloads
        run: dotnet workload install maui-android maui-windows

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The hygiene check runs again here rather than being inherited from ci. This is the
      # last point at which anything can be stopped, and it is cheap.
      - name: Check for domain specifics
        shell: bash
        run: scripts/check-public-hygiene

      - name: Pack
        shell: bash
        run: scripts/pack-local --version "${{ steps.version.outputs.value }}" --configuration Release --clean

      # A Controls.Maui packed without its Windows build restores fine and only fails in a
      # consumer's Windows build (journal §3.4). Fail here instead.
      - name: Check Controls.Maui carries every platform
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/local-feed -Filter 'BlackBeard.Argus.Controls.Maui.*.nupkg' | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            foreach ($tfm in 'lib/net8.0-android', 'lib/net8.0-windows10.0.19041') {
              if (-not ($zip.Entries | Where-Object { $_.FullName.StartsWith($tfm) })) {
                throw "$($package.Name) has no $tfm* folder"
              }
            }
          } finally { $zip.Dispose() }

      - name: Verify the packages before publishing
        run: dotnet test tests/Argus.Package.Tests/Argus.Package.Tests.csproj --configuration Release -p:ArgusPackageVersion="${{ steps.version.outputs.value }}"

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a short-lived
      # (1-hour) nuget.org API key, matched against a policy configured on nuget.org
      # (owner, repo, workflow file, environment). No long-lived credential stored here.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: blackbeard

      # bash expands the list and each package is pushed by name. On Windows, dotnet nuget push
      # given the quoted "artifacts/local-feed/*.nupkg" reports "File does not exist", though the
      # same line worked on Linux. Each .nupkg's symbol package beside it is pushed with it.
      - name: Push
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/local-feed/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packages in artifacts/local-feed" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
